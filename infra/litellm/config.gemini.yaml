model_list:
  - model_name: local-mock
    litellm_params:
      model: openai/mock-enterprise
      api_base: os.environ/MOCK_PROVIDER_URL
      api_key: local-mock-no-secret
  - model_name: qwen-local
    litellm_params:
      model: os.environ/OLLAMA_LITELLM_MODEL
      api_base: os.environ/OLLAMA_URL
  - model_name: google-gemini
    litellm_params:
      model: os.environ/GEMINI_LITELLM_MODEL
      api_base: os.environ/GEMINI_PROXY_URL
      # The real credential is held only by gemini-proxy and is sent upstream
      # as a header, so LiteLLM cannot include it in provider URLs or logs.
      api_key: local-gemini-proxy
  # Offline, deterministic embeddings for the product catalog ($0, no network).
  - model_name: mock-embedding
    litellm_params:
      model: openai/mock-embedding
      api_base: os.environ/MOCK_PROVIDER_URL
      api_key: local-mock-no-secret
    model_info:
      mode: embedding
  # Product-catalog embeddings through the same credential proxy; only GEMINI_EMBEDDING_MODEL is allowed there.
  - model_name: gemini-embedding
    litellm_params:
      model: os.environ/GEMINI_EMBEDDING_LITELLM_MODEL
      api_base: os.environ/GEMINI_EMBEDDING_PROXY_URL
      api_key: local-gemini-proxy
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  allow_requests_on_db_unavailable: false

litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  redact_user_api_key_info: true
  redact_messages_in_exceptions: true
